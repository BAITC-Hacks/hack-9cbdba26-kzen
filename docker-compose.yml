name: kzen

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Значения заданы явно, чтобы `docker compose up` работал без файла .env.
      APP_NAME: KZen
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DATA_DIR: /srv/data
      DEMO_FALLBACK: ${DEMO_FALLBACK:-true}
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      NARRATOR_BACKEND: ${NARRATOR_BACKEND:-template}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      # Расчёт не изменяет исходные книги, поэтому контейнер получает их read-only.
      - ./data:/srv/data:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
