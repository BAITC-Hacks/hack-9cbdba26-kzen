[project]
name = "hackathon-ml-service"
version = "0.1.0"
description = "Каркас ML-сервиса: FastAPI на чистой архитектуре + обучение"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "catboost>=1.2",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "anyio>=4.4", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "ml"]
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — это нормально

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001", "S101"]
# B008 — стандартный способ объявления зависимостей в FastAPI, здесь это не ошибка
"backend/app/api/routes/*" = ["B008"]

