server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API остаётся на том же origin: браузеру не нужны CORS и адрес контейнера.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://api:8000/metrics;
        proxy_set_header Host $host;
    }

    # React работает как SPA, поэтому неизвестный путь должен открыть index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
